services:
  - type: web
    name: dhruva
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    disk:
      name: dhruva-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: 'true'
      - key: CORS_ORIGINS
        value: ''
    healthCheckPath: /health